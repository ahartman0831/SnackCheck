name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Type generation policy
        run: pnpm test:types-policy
      - name: Unit tests
        run: pnpm test:unit
      - name: P0-5 submission ownership regression
        run: pnpm test:p0-5
      - name: Integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Secret scan
        run: |
          if git grep -nE 'sk-live-|BEGIN PRIVATE KEY|SERVICE_ROLE_KEY=[^[:space:]]+' -- ':!.env.example' ':!docs/**' ':!.github/workflows/ci.yml'; then
            echo "Possible secret material found"
            exit 1
          fi

  database:
    name: Local Supabase reset and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      - name: Start local non-production Supabase
        run: supabase start
      - name: Reset and seed through latest migration
        run: supabase db reset --yes
      - name: pgTAP
        run: supabase test db
      - name: Generate types from the local database
        run: pnpm db:types
        env:
          CI: true
      - name: Upload locally generated database types
        uses: actions/upload-artifact@v4
        with:
          name: local-database-types
          path: packages/db-types/src/database.types.ts
          retention-days: 1
      - name: Committed types match the local schema
        run: git diff --exit-code -- packages/db-types/src/database.types.ts
      - name: Reset a second time
        run: supabase db reset --yes
      - name: pgTAP after second reset
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e-webkit:
    name: Playwright WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install WebKit
        run: pnpm --filter web exec playwright install --with-deps webkit
      - name: Run mobile WebKit
        run: pnpm test:e2e:webkit
        env:
          CI: true
          DEV_CATALOG_ENABLED: "true"
      - name: Run camera WebKit
        run: pnpm test:e2e:camera
        env:
          CI: true
          DEV_CATALOG_ENABLED: "true"
          FEATURE_BARCODE_CAMERA: "true"
          NEXT_PUBLIC_FEATURE_BARCODE_CAMERA: "true"
