name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Secret scan
        run: |
          if git grep -nE 'sk-live-|service_role|BEGIN PRIVATE KEY' -- ':!.env.example' ':!docs/**'; then
            echo "Possible secret material found"
            exit 1
          fi
