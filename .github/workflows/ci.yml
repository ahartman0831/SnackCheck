name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Type generation policy
        run: pnpm test:types-policy
      - name: Database runner policy
        run: pnpm test:db-runner
      - name: Unit tests
        run: pnpm test:unit
      - name: P0-5 submission ownership regression
        run: pnpm test:p0-5
      - name: Integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Secret scan
        run: |
          if git grep -nE 'sk-live-|BEGIN PRIVATE KEY|SERVICE_ROLE_KEY=[^[:space:]]+' -- ':!.env.example' ':!docs/**' ':!.github/workflows/ci.yml'; then
            echo "Possible secret material found"
            exit 1
          fi

  database:
    name: Local Supabase reset and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2
      - name: Start local non-production Supabase
        run: supabase start
      - name: Reset and seed through latest migration
        run: supabase db reset --yes
      - name: pgTAP
        run: pnpm test:db
      - name: Generate types from the local database
        run: pnpm db:types
        env:
          CI: true
      - name: Upload locally generated database types
        uses: actions/upload-artifact@v4
        with:
          name: local-database-types
          path: packages/db-types/src/database.types.ts
          retention-days: 1
      - name: Committed types match the local schema
        run: git diff --exit-code -- packages/db-types/src/database.types.ts
      - name: Private photo storage integration
        shell: bash
        run: |
          source <(supabase status -o env)
          LOCAL_SUPABASE_PHOTO_TEST=true \
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          pnpm --filter web exec vitest run tests/integration/p6-photo-storage-local.test.ts --config vitest.integration.config.ts
      - name: Exclude unused system Chrome package feed
        # CI uses Playwright's locked browsers, not the runner's Google Chrome.
        # An inconsistent Chrome APT index must not block Ubuntu dependencies.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - name: Install database-journey browsers
        run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - name: Build and test the real local ingredient journey
        shell: bash
        run: |
          source <(supabase status -o env)
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUBMISSION_TOKEN_SECRET="$(openssl rand -hex 32)"
          export ANONYMOUS_KEY_HMAC_SECRET="$(openssl rand -hex 32)"
          export VERCEL_ENV=preview
          export ALLOW_PREVIEW_MEMORY_RATE_LIMIT=true
          export OPEN_FOOD_FACTS_ENABLED=false
          export PLAYWRIGHT_BASE_URL=https://127.0.0.1:3100
          export NEXT_PUBLIC_APP_URL="$PLAYWRIGHT_BASE_URL"
          pnpm build
          pnpm test:e2e:database
        env:
          CI: true
      - name: Upload failed database browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-browser-failure
          path: apps/web/test-results/
          retention-days: 1
      - name: Disposable backup and restore rehearsal
        run: bash scripts/rehearse-local-backup-restore.sh
        env:
          SNACKCHECK_DISPOSABLE_RESTORE_CONFIRM: DISPOSABLE_LOCAL_ONLY
      - name: Reset a second time
        run: supabase db reset --yes
      - name: pgTAP after second reset
        run: pnpm test:db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e-webkit:
    name: Playwright WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Exclude unused system Chrome package feed
        # CI uses Playwright's locked browsers, not the runner's Google Chrome.
        # An inconsistent Chrome APT index must not block Ubuntu dependencies.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - name: Install public-journey browsers
        run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - name: Build production app for WebKit
        run: pnpm build
      - name: Run desktop Chromium and accessibility checks
        run: pnpm --filter web exec playwright test --project=desktop-chromium
        env:
          CI: true
          DEV_CATALOG_ENABLED: "true"
      - name: Run mobile WebKit
        run: pnpm test:e2e:webkit
        env:
          CI: true
          DEV_CATALOG_ENABLED: "true"
      - name: Run camera WebKit
        run: pnpm test:e2e:camera
        env:
          CI: true
          DEV_CATALOG_ENABLED: "true"
          FEATURE_BARCODE_CAMERA: "true"
          NEXT_PUBLIC_FEATURE_BARCODE_CAMERA: "true"
